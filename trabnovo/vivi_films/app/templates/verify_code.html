{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 40px auto;">
    <h2 style="color: #e50914; text-align: center;">Verificar E-mail</h2>
    <p style="color:#aaa;text-align:center;font-size:14px;margin-bottom:14px;">
        Enviamos um código de 4 dígitos para seu e-mail.
    </p>
    <form method="POST" action="{{ url_for('routes.verify_code') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>E-mail</label>
        <input type="email" name="email" value="{{ email or '' }}" required
               style="width:100%;padding:10px;margin-bottom:12px;background:#121214;border:1px solid #29292e;color:#fff;border-radius:4px;">

        <label>Código (4 dígitos)</label>
        <input type="text" name="code" maxlength="4" required
               style="width:100%;padding:10px;margin-bottom:16px;background:#121214;border:1px solid #29292e;color:#fff;border-radius:4px;text-align:center;font-size:20px;letter-spacing:6px;">

        <button type="submit" class="btn" style="width:100%;">Verificar</button>
    </form>
</div>
{% endblock %}
