{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 40px auto;">
    <h2 style="color: #e50914; text-align: center;">Criar Conta</h2>
    <form method="POST" action="{{ url_for('routes.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Nome de Usuário (@nome_usuario)</label>
        <input type="text" name="username" placeholder="@seu_nome" required
               style="width:100%;padding:10px;margin-bottom:12px;background:#121214;border:1px solid #29292e;color:#fff;border-radius:4px;">

        <label>E-mail</label>
        <input type="email" name="email" required
               style="width:100%;padding:10px;margin-bottom:12px;background:#121214;border:1px solid #29292e;color:#fff;border-radius:4px;">

        <label>Senha</label>
        <input type="password" name="password" required
               style="width:100%;padding:10px;margin-bottom:12px;background:#121214;border:1px solid #29292e;color:#fff;border-radius:4px;">

        <label>Tipo de Conta</label>
        <div style="display:flex; gap:10px; margin-bottom:16px;">
            <label style="flex:1; display:flex; align-items:center; gap:8px;
                          padding:10px; background:#121214; border:1px solid #29292e;
                          border-radius:4px; cursor:pointer;">
                <input type="radio" name="account_type" value="user" checked
                       style="width:auto; margin:0;">
                <span>👤 Usuário</span>
            </label>

            <label style="flex:1; display:flex; align-items:center; gap:8px;
                          padding:10px; background:#121214; border:1px solid #29292e;
                          border-radius:4px; cursor:pointer;">
                <input type="radio" name="account_type" value="admin"
                       style="width:auto; margin:0;">
                <span>🛡️ Administrador</span>
            </label>
        </div>

        <button type="submit" class="btn" style="width:100%;">Cadastrar</button>
    </form>
    <p style="text-align:center;margin-top:14px;color:#aaa;font-size:14px;">
        Já tem conta?
        <a href="{{ url_for('routes.login') }}" style="color:#e50914;">Entrar</a>
    </p>
</div>
{% endblock %}
