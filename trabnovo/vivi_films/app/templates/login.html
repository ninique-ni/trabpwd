{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 40px auto;">
    <h2 style="color: #e50914; text-align: center;">Entrar</h2>
    <form method="POST" action="{{ url_for('routes.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>E-mail</label>
        <input type="email" name="email" required
               style="width:100%;padding:10px;margin-bottom:12px;background:#121214;border:1px solid #29292e;color:#fff;border-radius:4px;">

        <label>Senha</label>
        <input type="password" name="password" required
               style="width:100%;padding:10px;margin-bottom:16px;background:#121214;border:1px solid #29292e;color:#fff;border-radius:4px;">

        <button type="submit" class="btn" style="width:100%;">Entrar</button>
    </form>
    <p style="text-align:center;margin-top:14px;color:#aaa;font-size:14px;">
        Não tem conta?
        <a href="{{ url_for('routes.register') }}" style="color:#e50914;">Cadastre-se</a>
    </p>
</div>
{% endblock %}
